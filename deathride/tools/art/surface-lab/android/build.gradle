plugins { id 'com.android.application' }
configurations { nativeJars }
android {
    namespace 'dev.deathride.artlab'
    compileSdk 36
    defaultConfig { applicationId 'dev.deathride.artlab'; minSdk 28; targetSdk 34; versionCode 4; versionName 'v4-fusion'; ndk { abiFilters 'armeabi-v7a' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir '../assets'
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('generated/natives')
}
dependencies {
    implementation project(':core')
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.13.5'
    nativeJars 'com.badlogicgames.gdx:gdx-platform:1.13.5:natives-armeabi-v7a'
}
tasks.register('extractNatives') {
    inputs.files configurations.nativeJars
    outputs.dir layout.buildDirectory.dir('generated/natives')
    doLast { configurations.nativeJars.files.each { jar -> copy { from zipTree(jar); include '**/*.so'; into layout.buildDirectory.dir('generated/natives/armeabi-v7a') } } }
}
tasks.named('preBuild') { dependsOn 'extractNatives' }
