# Repo guardrails: the shape rules AGENTS.md states, held by checks instead of by sentences.
#  - layering: tools/desk-boundaries-test.cjs fails when desk/src/ breaks its layering (engines are a leaf behind their
#    entry modules, rules load no engine or Node built-in, only engines spawn, only the session writes; .ai/memory/0018),
#    and tools/guidance-overlay-test.cjs fails when a separate build (deathride/, desk/) has no AGENTS.md + CLAUDE.md
#    overlay deferring to the root AGENTS.md. Plain node, no install.
#  - provenance (pull requests): tools/commit-provenance.cjs --check reads the pull request's commits and annotates every
#    AI-marked commit that names its agent or its lane only in prose (.ai/memory/0019). It warns and passes today,
#    because the loop lane does not write the Agent-Lane and Co-Authored-By trailers yet. Once it does, the operator
#    adds --strict to that step and the job blocks.
name: repo-guardrails
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  layering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Desk layering (rules, engines, session)
        run: node tools/desk-boundaries-test.cjs
      - name: A guidance overlay for every separate build
        run: node tools/guidance-overlay-test.cjs

  provenance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Provenance suite
        run: node tools/commit-provenance-test.cjs
      - name: Agent authorship of this pull request (warns; --strict blocks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/commit-provenance.cjs --check "$BASE_SHA..$HEAD_SHA"
