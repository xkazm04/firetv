# Supply chain: two things nobody has to remember.
#  1. dependency-graph - submits the resolved Gradle dependencies of both Gradle builds to GitHub's
#     dependency graph, so a CVE in Ktor (the server inside the TV APK), Media3 or Compose raises a
#     Dependabot alert. Without a submission, GitHub cannot see Gradle's resolved graph.
#  2. apk - builds the telestrator debug APK from main, checksums it and attests its build
#     provenance, so whoever sideloads it can check it came from this repo's CI:
#       gh attestation verify tv-app-debug.apk -R xkazm04/firetv
#     (see CONTRIBUTING.md, "Verifying a TV APK"). It is the debug build: there is no release keystore.
# gradle.properties pins the operator's local Android Studio JBR, which does not exist on a runner;
# each job drops that one line from the checkout and uses the JDK that setup-java installs.
name: supply-chain
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dependency-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the dependency submission API needs it
    strategy:
      fail-fast: false
      matrix:
        root: [".", "deathride"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Drop the operator's local JDK pin
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties
      - uses: gradle/actions/dependency-submission@v4
        with:
          build-root-directory: ${{ matrix.root }}

  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Drop the operator's local JDK pin
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties
      - name: Generate the fixture clip (fixtures/README.md; R.raw.fixture_clip must exist)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          mkdir -p tv-app/src/main/res/raw
          ffmpeg -y \
            -f lavfi -i "testsrc2=size=1280x720:rate=25:duration=20" \
            -vf "drawbox=x='mod(t*140\,1180)':y='360+220*sin(t*2)':w=90:h=90:color=orange@0.95:t=fill" \
            -c:v libx264 -pix_fmt yuv420p -profile:v baseline -level 3.1 -g 25 \
            tv-app/src/main/res/raw/fixture_clip.mp4
      - name: Test core, build the APK
        run: node tools/gradlew.cjs :core:test :tv-app:assembleDebug --console=plain
      - name: Checksum
        run: |
          mkdir -p dist
          cp tv-app/build/outputs/apk/debug/tv-app-debug.apk dist/tv-app-debug.apk
          cd dist && sha256sum tv-app-debug.apk > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/tv-app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tv-app-debug-${{ github.sha }}
          path: dist/
          if-no-files-found: error
