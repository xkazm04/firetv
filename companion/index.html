<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Telestrator Pen</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e;
    --ink:#FFD400; --aspect:1.7778;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; user-select:none; }

  header { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); }
  #dot { width:9px; height:9px; border-radius:50%; background:#f85149; flex:none; transition:background .2s; }
  #dot.on { background:#3fb950; }
  #status { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #status.bad { color:#f85149; }

  #padwrap { flex:1; display:grid; place-items:start center; padding:10px; min-height:0; }
  /* The pen surface carries the *video's* aspect ratio, so a normalized point means the same
     place on the phone and on the TV. Without this, every stroke arrives stretched. */
  #pad { position:relative; width:100%; max-height:100%; aspect-ratio:var(--aspect);
    border:1px solid var(--line); border-radius:8px; background:#010409 center/cover no-repeat;
    touch-action:none; overflow:hidden; }
  #pad canvas { position:absolute; inset:0; width:100%; height:100%; }
  #mirror { opacity:.75; }
  #hint { position:absolute; inset:0; display:grid; place-items:center; color:#3d444d;
    font-size:14px; pointer-events:none; text-align:center; padding:0 20px; }
  #hint.hide { display:none; }

  /* Inline label entry. Deliberately not prompt(): a modal dialog freezes the page, and on a
     phone it hides the very frame the viewer is labelling. */
  #tagbox { position:absolute; inset:auto 8px 8px 8px; display:none; gap:6px;
    background:rgba(13,17,23,.95); border:1px solid var(--line); border-radius:8px; padding:8px; }
  #tagbox.show { display:flex; }
  #tagtext { flex:1; min-width:0; background:#010409; border:1px solid var(--line); border-radius:6px;
    color:var(--fg); padding:8px; font-size:15px; }

  nav { padding:0 10px 12px; display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; gap:6px; }
  button { flex:1 1 0; min-width:0; padding:11px 4px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); color:var(--fg); font-size:12px; font-weight:600; white-space:nowrap; }
  button:disabled { opacity:.35; }
  button[aria-pressed="true"] { background:var(--ink); color:#000; border-color:var(--ink); }
  button:active:not(:disabled) { filter:brightness(1.4); }

  .swatch { flex:0 0 40px; height:36px; border-radius:8px; border:2px solid transparent; padding:0; }
  .swatch[aria-pressed="true"] { border-color:#fff; }

  input[type=range] { flex:1; accent-color:var(--ink); min-width:0; }
  .lbl { color:var(--dim); font-size:11px; align-self:center; flex:0 0 auto;
    font-variant-numeric:tabular-nums; }

  /* Review mode: one tick per drawn moment. Inset by half the range thumb so a tick sits where the
     thumb lands when the TV is on that frame. */
  #scrubwrap { position:relative; flex:1; min-width:0; display:flex; }
  #marks { position:absolute; inset:0 8px; pointer-events:none; }
  #marks i { position:absolute; top:50%; width:3px; height:16px; margin:-8px 0 0 -1.5px;
    border-radius:2px; background:var(--ink); opacity:.55; }
  #marks i.on { opacity:1; }
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <strong>Pen</strong>
  <span id="status">connecting…</span>
</header>

<div id="padwrap">
  <div id="pad">
    <canvas id="mirror"></canvas>
    <canvas id="cv"></canvas>
    <div id="hint">draw here</div>
    <div id="tagbox">
      <input id="tagtext" type="text" placeholder="#10 Novák" autocomplete="off" enterkeyhint="done">
      <button id="tagok" style="flex:0 0 64px">Add</button>
      <button id="tagcancel" style="flex:0 0 64px">✕</button>
    </div>
  </div>
</div>

<nav>
  <div class="row" id="tools">
    <button data-tool="freehand" aria-pressed="true">Draw</button>
    <button data-tool="arrow" aria-pressed="false">Arrow</button>
    <button data-tool="circle" aria-pressed="false">Circle</button>
    <button data-tool="spotlight" aria-pressed="false">Spot</button>
    <button data-tool="tag" aria-pressed="false">Tag</button>
    <button data-tool="erase" aria-pressed="false">Erase</button>
  </div>

  <div class="row" id="colors">
    <button class="swatch" data-color="#FFD400" aria-pressed="true"  style="background:#FFD400"></button>
    <button class="swatch" data-color="#FF3B30" aria-pressed="false" style="background:#FF3B30"></button>
    <button class="swatch" data-color="#00E5FF" aria-pressed="false" style="background:#00E5FF"></button>
    <button class="swatch" data-color="#32D74B" aria-pressed="false" style="background:#32D74B"></button>
    <button class="swatch" data-color="#FFFFFF" aria-pressed="false" style="background:#FFFFFF"></button>
    <button id="btn-hold" aria-pressed="false" title="Keep drawings until cleared">Pin</button>
  </div>

  <div class="row">
    <button id="btn-undo" disabled>Undo</button>
    <button id="btn-redo" disabled>Redo</button>
    <button id="btn-clear">Clear</button>
  </div>

  <div class="row">
    <button id="btn-prev">◀ Frame</button>
    <button id="btn-playpause">Play</button>
    <button id="btn-next">Frame ▶</button>
  </div>

  <div class="row" id="review">
    <button id="btn-mark-prev" disabled title="Previous drawing">◀ Drawing</button>
    <button id="btn-mark-next" disabled title="Next drawing">Drawing ▶</button>
  </div>

  <div class="row" id="rates">
    <button data-rate="0.25" aria-pressed="false">0.25×</button>
    <button data-rate="0.5"  aria-pressed="false">0.5×</button>
    <button data-rate="1"    aria-pressed="true">1×</button>
  </div>

  <div class="row">
    <span class="lbl" id="scrub-t">0.0s</span>
    <div id="scrubwrap">
      <input id="scrub" type="range" min="0" max="1000" value="0" step="1">
      <div id="marks"></div>
    </div>
  </div>
</nav>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const pad = $('pad'), cv = $('cv'), ctx = cv.getContext('2d');
  const mirror = $('mirror'), mctx = mirror.getContext('2d');
  const statusEl = $('status'), dot = $('dot'), hint = $('hint');
  const tagbox = $('tagbox'), tagtext = $('tagtext');

  const pin = new URLSearchParams(location.search).get('pin') || '0000';
  const clientId = 'pen-' + Math.random().toString(36).slice(2, 8);

  let tool = 'freehand';
  let color = '#FFD400';
  let sticky = false;
  let ws = null, connected = false, paired = false;
  let lastState = null, scrubbing = false, tvDoc = null, prevT = null;

  // ---- transport -----------------------------------------------------------
  function connect() {
    ws = new WebSocket('ws://' + location.host + '/ws');
    ws.onopen = () => {
      connected = true;
      send({ type: 'hello', pin, clientId });
    };
    ws.onclose = () => {
      connected = paired = false;
      dot.classList.remove('on');
      if (!statusEl.classList.contains('bad')) statusEl.textContent = 'reconnecting…';
      setTimeout(connect, 1000);
    };
    ws.onmessage = (e) => onMessage(JSON.parse(e.data));
  }
  function send(o) { if (connected) ws.send(JSON.stringify(o)); }

  function onMessage(m) {
    if (m.type === 'welcome') {
      if (!m.accepted) {
        statusEl.textContent = 'not paired: ' + (m.reason || 'rejected') + ' — rescan the QR on the TV';
        statusEl.classList.add('bad');
        return;
      }
      paired = true;
      statusEl.classList.remove('bad');
      dot.classList.add('on');
      // Match the TV's video aspect so the pad and the picture share one coordinate space.
      document.documentElement.style.setProperty('--aspect', m.videoAspect);
      requestAnimationFrame(fit);
    } else if (m.type === 'state') {
      lastState = m;
      applyState(m);
    } else if (m.type === 'doc') {
      tvDoc = m.doc;
      drawMirror();
    }
  }

  // ---- review mode: the drawn moments the TV publishes ---------------------
  // The same rule as AnnotationTimeline in core: the playhead "sits on" a moment from one frame
  // before it until MOMENT_SPAN_MS after it; next skips the moment it sits on, and so does prev.
  const MOMENT_SPAN_MS = 500, ON_MOMENT_LEAD_MS = 40;
  const momentAfter = (marks, t) => marks.find((m) => m > t + ON_MOMENT_LEAD_MS) ?? null;
  const momentBefore = (marks, t) => [...marks].reverse().find((m) => m + MOMENT_SPAN_MS <= t) ?? null;
  const momentAt = (marks, t) => marks.findIndex((m) => t >= m - ON_MOMENT_LEAD_MS && t < m + MOMENT_SPAN_MS);

  let marksKey = '';
  function applyMarks(m) {
    const marks = m.marks || [];
    const on = momentAt(marks, m.t);
    const key = marks.join(',') + '|' + m.durationMs + '|' + on;
    if (key !== marksKey) {
      marksKey = key;
      const box = $('marks');
      box.textContent = '';
      if (m.durationMs > 0) {
        marks.forEach((at, i) => {
          const tick = document.createElement('i');
          tick.style.left = Math.min(100, (at / m.durationMs) * 100) + '%';
          if (i === on) tick.className = 'on';
          box.appendChild(tick);
        });
      }
    }
    $('btn-mark-prev').disabled = momentBefore(marks, m.t) === null;
    $('btn-mark-next').disabled = momentAfter(marks, m.t) === null;
    return on >= 0 ? ' · drawing ' + (on + 1) + ' of ' + marks.length : '';
  }

  function applyState(m) {
    statusEl.textContent =
      (m.paused ? 'paused' : 'playing') + ' · ' + (m.t / 1000).toFixed(1) + 's · ink=' + m.annotationCount +
      applyMarks(m);
    $('btn-undo').disabled = !m.canUndo;
    $('btn-redo').disabled = !m.canRedo;
    $('btn-playpause').textContent = m.paused ? 'Play' : 'Pause';
    $('scrub-t').textContent = (m.t / 1000).toFixed(1) + 's';
    if (m.t !== (prevT ?? -1)) { prevT = m.t; }
    if (!scrubbing && m.durationMs > 0) {
      $('scrub').value = Math.round((m.t / m.durationMs) * 1000);
    }
    // The thumbnail is the whole point of aiming: without it the pad is a blank rectangle and
    // the viewer is drawing from memory.
    if (m.thumbnail) {
      pad.style.backgroundImage = 'url(' + m.thumbnail + ')';
      hint.classList.add('hide');
    } else if (!m.paused) {
      pad.style.backgroundImage = '';
      tvDoc = null;
      mctx.clearRect(0, 0, mirror.width, mirror.height);
    }
    drawMirror();
  }
  connect();

  // ---- pen surface ---------------------------------------------------------
  function fit() {
    const r = pad.getBoundingClientRect();
    for (const [c, g] of [[cv, ctx], [mirror, mctx]]) {
      c.width = Math.round(r.width * devicePixelRatio);
      c.height = Math.round(r.height * devicePixelRatio);
      g.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      g.lineCap = g.lineJoin = 'round';
    }
    drawMirror();
  }
  addEventListener('resize', fit); fit();

  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const norm = (e) => {
    const r = pad.getBoundingClientRect();
    return [
      clamp01((e.clientX - r.left) / r.width),
      clamp01((e.clientY - r.top) / r.height),
      e.pressure > 0 ? e.pressure : 0.5,
    ];
  };
  const px = (n) => [n[0] * pad.clientWidth, n[1] * pad.clientHeight];
  const hold = () => (sticky ? 'sticky' : null);
  const clearCanvas = () => ctx.clearRect(0, 0, cv.width, cv.height);

  let drawing = false, batch = [], start = null, last = null, flushTimer = null;

  function flush(phase) {
    if (!batch.length && phase !== 'up') return;
    send({ type: 'pen', tool: 'freehand', phase, color, width: 0.006, hold: hold(), pts: batch });
    batch = [];
  }

  pad.addEventListener('pointerdown', (e) => {
    if (tagbox.classList.contains('show')) return;
    pad.setPointerCapture(e.pointerId);
    const n = norm(e);
    start = last = n;

    if (tool === 'tag') { openTag(n); return; }
    if (tool === 'erase') { send({ type: 'erase', x: n[0], y: n[1] }); flashDot(n); return; }

    drawing = true;
    hint.classList.add('hide');
    if (tool === 'freehand') {
      batch = [[n[0], n[1], n[2], performance.now()]];
      flush('down');
      // Batch at ~60 Hz rather than one message per pointermove.
      flushTimer = setInterval(() => flush('move'), 16);
    }
    ctx.beginPath();
    const p = px(n);
    ctx.moveTo(p[0], p[1]);
  });

  pad.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of events) {
      const n = norm(ev);
      if (tool === 'freehand') {
        batch.push([n[0], n[1], n[2], performance.now()]);
        // Local echo: ink appears under the finger immediately, the TV catches up.
        const p = px(n);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2 + 4 * n[2];
        ctx.lineTo(p[0], p[1]);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p[0], p[1]);
      }
      last = n;
    }
    if (tool !== 'freehand') previewShape(start, last);
  });

  function endStroke(e) {
    if (!drawing) return;
    drawing = false;
    const n = last || norm(e);
    if (tool === 'freehand') {
      clearInterval(flushTimer); flushTimer = null;
      batch.push([n[0], n[1], n[2], performance.now()]);
      flush('up');
    } else {
      send({ type: 'shape', tool, from: [start[0], start[1]], to: [n[0], n[1]], color, width: 0.006, hold: hold() });
    }
    setTimeout(clearCanvas, 400);
  }
  pad.addEventListener('pointerup', endStroke);
  pad.addEventListener('pointercancel', endStroke);

  function previewShape(a, b) {
    clearCanvas();
    const p1 = px(a), p2 = px(b);
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    if (tool === 'arrow') { ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); }
    else { ctx.arc(p1[0], p1[1], Math.hypot(p2[0] - p1[0], p2[1] - p1[1]), 0, Math.PI * 2); }
    ctx.stroke();
  }

  // ---- mirror of what is on the TV ----------------------------------------
  // Deliberately a simplified rendering: it exists so the viewer can see what is already drawn
  // (above all, what they are about to erase), not to be pixel-identical to the TV.
  function drawMirror() {
    mctx.clearRect(0, 0, mirror.width, mirror.height);
    if (!tvDoc || !lastState || !lastState.paused) return;
    const t = lastState.t;
    const W = pad.clientWidth, H = pad.clientHeight;
    const X = (v) => v * W, Y = (v) => v * H;

    for (const a of tvDoc.annotations) {
      if (t < a.fromMs || t > a.toMs) continue;
      const col = (a.style && a.style.color) || '#FFD400';
      mctx.strokeStyle = col;
      mctx.fillStyle = col;
      mctx.lineWidth = Math.max(1.5, ((a.style && a.style.width) || 0.006) * W);
      mctx.beginPath();

      if (a.type === 'stroke') {
        a.points.forEach((p, i) => (i ? mctx.lineTo(X(p[0]), Y(p[1])) : mctx.moveTo(X(p[0]), Y(p[1]))));
        mctx.stroke();
      } else if (a.type === 'arrow') {
        const x1 = X(a.to[0]), y1 = Y(a.to[1]);
        mctx.moveTo(X(a.from[0]), Y(a.from[1]));
        mctx.lineTo(x1, y1);
        const ang = Math.atan2(y1 - Y(a.from[1]), x1 - X(a.from[0]));
        const head = mctx.lineWidth * 5;
        for (const d of [Math.PI - 0.45, Math.PI + 0.45]) {
          mctx.moveTo(x1, y1);
          mctx.lineTo(x1 + head * Math.cos(ang + d), y1 + head * Math.sin(ang + d));
        }
        mctx.stroke();
      } else if (a.type === 'circle' || a.type === 'spotlight') {
        mctx.arc(X(a.center[0]), Y(a.center[1]), a.radius * W, 0, Math.PI * 2);
        mctx.stroke();
      } else if (a.type === 'nameTag') {
        const x = X(a.anchor[0]), y = Y(a.anchor[1]);
        mctx.arc(x, y, 4, 0, Math.PI * 2);
        mctx.fill();
        mctx.font = 'bold 11px system-ui, sans-serif';
        const w = mctx.measureText(a.label).width;
        mctx.fillRect(x - w / 2 - 4, y - 26, w + 8, 15);
        mctx.fillStyle = '#000';
        mctx.fillText(a.label, x - w / 2, y - 15);
      }
    }
  }

  function flashDot(n) {
    const p = px(n);
    clearCanvas();
    ctx.strokeStyle = '#f85149'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p[0], p[1], 14, 0, Math.PI * 2); ctx.stroke();
    setTimeout(clearCanvas, 300);
  }

  // ---- name tags -----------------------------------------------------------
  let tagAt = null;
  function openTag(n) {
    tagAt = n;
    tagbox.classList.add('show');
    tagtext.value = '';
    tagtext.focus();
    flashDot(n);
  }
  function closeTag() { tagbox.classList.remove('show'); tagAt = null; }
  function commitTag() {
    const label = tagtext.value.trim();
    if (label && tagAt) send({ type: 'tag', x: tagAt[0], y: tagAt[1], label, color, hold: hold() });
    closeTag();
  }
  $('tagok').addEventListener('click', commitTag);
  $('tagcancel').addEventListener('click', closeTag);
  tagtext.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commitTag(); }
    if (e.key === 'Escape') closeTag();
  });

  // ---- palette -------------------------------------------------------------
  function radio(containerId, attr, onPick) {
    document.querySelectorAll('#' + containerId + ' [' + attr + ']').forEach((b) => {
      b.addEventListener('click', () => {
        document.querySelectorAll('#' + containerId + ' [' + attr + ']')
          .forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
        onPick(b.getAttribute(attr));
      });
    });
  }
  radio('tools', 'data-tool', (v) => { tool = v; closeTag(); });
  radio('colors', 'data-color', (v) => { color = v; });
  radio('rates', 'data-rate', (v) => send({ type: 'transport', cmd: 'rate', value: Number(v) }));

  $('btn-hold').addEventListener('click', (e) => {
    sticky = !sticky;
    e.currentTarget.setAttribute('aria-pressed', String(sticky));
  });

  $('btn-undo').addEventListener('click', () => send({ type: 'undo' }));
  $('btn-redo').addEventListener('click', () => send({ type: 'redo' }));
  $('btn-clear').addEventListener('click', () => send({ type: 'clear' }));
  $('btn-playpause').addEventListener('click', () => send({ type: 'transport', cmd: 'toggle' }));
  $('btn-prev').addEventListener('click', () => send({ type: 'transport', cmd: 'step', value: -1 }));
  $('btn-next').addEventListener('click', () => send({ type: 'transport', cmd: 'step', value: 1 }));
  // The TV decides which moment is next (TransportPlan "jump") and lands paused on it.
  $('btn-mark-prev').addEventListener('click', () => send({ type: 'transport', cmd: 'jump', value: -1 }));
  $('btn-mark-next').addEventListener('click', () => send({ type: 'transport', cmd: 'jump', value: 1 }));

  const scrub = $('scrub');
  scrub.addEventListener('pointerdown', () => { scrubbing = true; });
  scrub.addEventListener('input', () => {
    if (!lastState || !lastState.durationMs) return;
    $('scrub-t').textContent = ((scrub.value / 1000) * lastState.durationMs / 1000).toFixed(1) + 's';
  });
  const endScrub = () => {
    if (!scrubbing) return;
    scrubbing = false;
    if (lastState && lastState.durationMs) {
      send({ type: 'transport', cmd: 'seek', value: (scrub.value / 1000) * lastState.durationMs });
    }
  };
  scrub.addEventListener('pointerup', endScrub);
  scrub.addEventListener('change', endScrub);

  // Exposed so the Playwright live UI test can drive the page without guessing at internals.
  window.__pen = {
    isConnected: () => connected && paired,
    state: () => lastState,
    setTool: (t) => { tool = t; },
    setColor: (c) => { color = c; },
    setSticky: (v) => { sticky = !!v; },
    mirrored: () => (tvDoc ? tvDoc.annotations.length : 0),
  };
})();
</script>
</body>
</html>
