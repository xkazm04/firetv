org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# Gradle runs on the JDK in JAVA_HOME; nothing pins a machine path here. :core asks for a JDK 17 toolchain:
# Gradle finds one in the usual install places, and this list only adds where Android Studio keeps its JBR.
# A path that does not exist on a machine is skipped, so the line is safe everywhere.
org.gradle.java.installations.paths=C:/Program Files/Android/Android Studio/jbr,/Applications/Android Studio.app/Contents/jbr/Contents/Home

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
