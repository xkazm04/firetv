# Capabilities: proves every command in .ai/manifest.yaml still works, weekly and on demand.
#  - Runs `node .ai/doctor.mjs --run --json`, which executes each capability (build, test, test-desk,
#    typecheck, evals) and records pass or fail per command.
#  - scripts/capability-proof.mjs judges the run on those capability findings only. The doctor's own
#    exit code is useless here: it also fails on the deliberate, human-owned control.prepush finding
#    (.ai/memory/0011).
#  - A failed capability turns this run red, names the command in the step summary, and GitHub emails
#    the owner. CI never commits the `verified` flags the doctor writes back. The manifest diff is
#    uploaded with the report so a human or a session can fix the command, or commit the honest
#    write-back from a local `node .ai/doctor.mjs --run` (.ai/memory/0012).
#  - Trusted events only (schedule, dispatch on the default branch), never pull_request: --run
#    shell-executes the manifest's commands (see the SECURITY note in .ai/doctor.mjs).
# The doctor gives each command 180 s, so the slow work (Gradle, npm ci, the APK build) is warmed up
# first. A capability then re-runs against up-to-date outputs and proves the command itself.
# gradle.properties pins the operator's local Android Studio JBR, which does not exist on a runner;
# the job drops that one line from the checkout and uses the JDK that setup-java installs.
name: capabilities
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desk/package-lock.json
      - name: Drop the operator's local JDK pin
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties
      - name: Generate the fixture clip (fixtures/README.md; the same command as supply-chain.yml)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          mkdir -p tv-app/src/main/res/raw
          ffmpeg -y \
            -f lavfi -i "testsrc2=size=1280x720:rate=25:duration=20" \
            -vf "drawbox=x='mod(t*140\,1180)':y='360+220*sin(t*2)':w=90:h=90:color=orange@0.95:t=fill" \
            -c:v libx264 -pix_fmt yuv420p -profile:v baseline -level 3.1 -g 25 \
            tv-app/src/main/res/raw/fixture_clip.mp4
      - run: npm ci --prefix desk
      - name: Warm up Gradle (so each capability fits the doctor's 180 s budget)
        run: node tools/gradlew.cjs :core:test :tv-app:assembleDebug --console=plain
      - name: Run every manifest capability (doctor --run)
        run: node .ai/doctor.mjs --run --json > doctor.out || true
      - name: Judge the capability findings
        run: node scripts/capability-proof.mjs doctor.out
      - name: Show which verified flags the run would flip (never committed by CI)
        if: always()
        run: git diff -- .ai/manifest.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capabilities-${{ github.run_id }}
          path: |
            doctor.out
            .ai/manifest.yaml
          if-no-files-found: warn
