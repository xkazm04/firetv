# .ai/manifest.yaml: the agent-facing contract for this repo.
# Generated by Ascent. Capabilities are tool-NEUTRAL (a name -> the command that fulfils it), the
# heavy subsystems are referenced by path, and unknown fields MUST be ignored, so this survives
# tool churn and schema growth. Full contract: .ai/SPEC.md
schema: ai-manifest
schemaVersion: 0.3.0
spec: .ai/SPEC.md
generatedAt: "2026-10-05"
generatedFrom: [settings.gradle.kts, gradle/libs.versions.toml, desk/package.json]

repo:
  name: firetv
  purpose: "Three Fire TV products driven from a phone: the Telestrator PoC (core/, tv-app/, companion/), the Study Desk Next.js prototype (desk/) and the standalone Death Ride racer (deathride/)"
  languages: [kotlin, typescript, javascript, python]
  archetype: solo

# Capabilities, not tools. Add keys freely; older readers ignore unknown ones.
# `verified` is a claim the doctor's --run writes back: true once it has actually run the command
# and it passed, false when the run fails (a stale true never outlives a broken command).
# Gradle goes through tools/gradlew.cjs so one command line works on Windows and Linux. Outside the
# operator's machine, gradle.properties' org.gradle.java.home must be overridden (see AGENTS.md).
# The tv-app build needs local.properties and the generated fixture clip (fixtures/README.md).
# deathride/ is a separate Gradle build and is gated from its own directory.
# evals is the deterministic AI-output subset of test-desk (model roles stubbed, no live call; see
# docs/AI_HARNESS.md). It needs desk/node_modules. Every capability here runs through doctor --run
# on demand (.github/workflows/capabilities-pr.yml, manual: issue #12) and weekly (capabilities.yml). CI never
# commits the verified flags it computes. A flag becomes true only through a local doctor --run whose
# write-back is committed in a PR, and that PR's run must then pass it (.ai/memory/0016).
capabilities:
  build: { command: "node tools/gradlew.cjs :tv-app:assembleDebug", verified: false }
  test: { command: "node tools/gradlew.cjs :core:test", verified: false }
  test-desk: { command: "npm --prefix desk test", verified: false }
  typecheck: { command: "npm --prefix desk run test:types", verified: false }
  evals: { command: "node tools/maths-judge-test.cjs && node tools/calc-marking-test.cjs && node tools/withhold-rules-test.cjs && node tools/uat-verdict-test.cjs && node tools/uat-metrics-test.cjs && node tools/uat-recertify-test.cjs && node tools/uat-ledger-test.cjs && node tools/uat-surface-test.cjs", verified: false }

# Pointers: these subsystems can change format underneath without breaking this contract. Every
# path DECLARED here must exist (the doctor checks it); a pointer you don't declare is not a finding.
# Add optional ones as the repo grows them, e.g.:
#   evals: evals/
paths:
  contextIndex: .ai/context-index.json
  memory: .ai/memory/
  guardrails: .ai/guardrails.yaml
  evals: uat/
  harness: docs/AI_HARNESS.md

context:
  rule: "every module directory over 12 files has a CONTEXT.md"

boundaries:
  neverTouch: [desk/data/]
  secretsFrom: "process environment; locally the gitignored desk/.env.local (ELEVENLABS_API_KEY and engine settings). No vault; nothing secret is committed"

# Vendor-neutral registry of the agents and agent roles that work in this repo. entrypoint is the file
# the agent reads first; the skill overlays carry each role's procedure.
agents:
  - { id: claude-code, kind: coding-agent, entrypoint: AGENTS.md }
  - { id: codex, kind: coding-agent, entrypoint: AGENTS.md }
  - { id: scan-sweep, kind: skill-quality-sweep, entrypoint: .claude/scan-sweep/config.md }
  - { id: uat, kind: skill-acceptance-test, entrypoint: uat/README.md }
  - { id: cx, kind: skill-journey-walk, entrypoint: .claude/cx/config.md }
  - { id: spark, kind: skill-design-and-build, entrypoint: .claude/spark/config.md }
  - { id: contest, kind: skill-design-contest, entrypoint: .claude/contest/config.md }
  - { id: perfect, kind: skill-module-perfection, entrypoint: .claude/perfect/config.md }
  - { id: leonardo, kind: skill-image-assets, entrypoint: .claude/leonardo/config.md }
  - { id: architect, kind: skill-architecture, entrypoint: .claude/architect/config.md }
  - { id: friend, kind: skill-friend, entrypoint: .claude/friend/config.md }

# One authority for agent guidance. desk/AGENTS.md is a nested, Next.js-managed file that defers to
# the canonical one; it is not a projection (next dev rewrites its marked block).
guidance:
  canonical: AGENTS.md
  projections: []

# The control model (shift-left): where each capability is PRIMARILY enforced. CI is the thin
# backstop for hard passes only. TUNE this split for your repo: fast checks pre-push; slow suites
# (full tests, full-tree SAST) in CI. The agent runs tests in its verify step regardless of placement.
controls:
  prePush: [lint, scan-secrets]
  ciHardPass: [test, sast, merge-gate]

# The organization's AI registry - knowledge bundles this repo consumes and the skill
# marketplace it installs from. Unknown fields MUST be ignored by a reader.
registry:
  remote: github:xkazm04/ai-registry
  local: ../ai-registry
knowledge:
  domains: [software-engineering, localization, llm-observability]

# Shared skills this project uses, from the registry's skills/ lane. The LINK is machine
# state (gitignored, made by ai-registry/scripts/link-registry.mjs); THIS list is the
# reviewable declaration. A skill not listed here is project-owned and lives in
# .claude/skills/ as a real directory.
skills:
  - architect
  - contest
  - council
  - cx
  - explorer
  - friend
  - leonardo
  - scan-sweep
  - spark
  - tiger
  - uat
